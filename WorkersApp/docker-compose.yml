
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    # No volume on purpose: `docker compose down` resets the demo data.
    # No published port: the API reaches the DB at db:1433 on the Compose network.
    # For SSMS access add:  ports: ["127.0.0.1:1433:1433"]
 
  db-init:
    build: ./db
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SQLCMDSERVER: db
      SQLCMDUSER: sa
      SQLCMDPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
 
  api:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__cn: "Server=db,1433;Database=workers;User Id=invitado;Password=${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"